# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repo]
name = "se-theory-neutral-substrate"
org = "structural-explainability"
class = "theory"
kind = "foundation"
status = "active"
since = "2026"
summary = "Lean 4 formalization of the neutral structural substrate defining admissibility, separation, and substrate invariants without encoding identity regimes."

# === Layer Position ===

[layer]
space = "formal-theory"
role = "theory"

# === Dependency Declarations ===

[depends]
# foundational theory repo
optional = []
required = []

# === Provided Artifacts ===

[provides]
# theory repos expose Lean modules, not operational artifacts
artifacts = [
  "lean-library",
  "theorem-set",
]

[provides.formalization.public_surface]
kind = "lean-surface"
status = "active"
symbols = [
  "SE.NeutralSubstrate",
]
path = "SE/NeutralSubstrate.lean"
reason = "Public Lean import surface for the neutral-substrate theory."

[provides.formalization.theorems]
kind = "lean-theorem-set"
status = "active"
symbols = [
  "not_neutral_if_causal_or_normative",
  "neutral_if_only_neutral",
  "ontological_neutrality_theorem",
  "only_neutral_primitives_implies_INC",
  "framework_contestability_lemma",
  "separate_stability",
]
path = "SE/NeutralSubstrate/Core.lean"
reason = "Machine-checked theorem set for neutral-substrate admissibility and separation."

# === Scope ===

[scope]
includes = [
  "neutral structural primitives",
  "substrate well-formedness",
  "admissibility conditions for regime application",
  "separation constraints (non-encoding of regimes)",
  "substrate-level invariants",
  "machine-checked Lean theorems",
]

excludes = [
  "identity regime definitions",
  "regime-profile derivation",
  "persistence behavior",
  "mapping semantics",
  "operational validation logic",
  "repository governance rules",
  "schema definitions for other repositories",
  "domain-specific mappings or data",
  "runtime systems",
]

# === Validation ===

[validation]
# Validates repository declaration, manifest schema conformance,
# reference artifacts, and Lean public surface coverage.
entrypoint = "uv run se-validate"
reference_entrypoint = "uv run se-ref-validate"
export_check_entrypoint = "uv run se-ref-export --check"
strict_entrypoint = "uv run se-validate --strict"
tag_entrypoint = "uv run se-validate --require-tag"

# === Behavior / governance ===

[naming]
pattern = "se-theory-*"

[governance]
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"
preferred = "CITATION.cff"

[traceability]
identifier_map = "reference/index.toml"
