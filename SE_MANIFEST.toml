# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-neutral-substrate"
class = "theory"
kind = "foundation"
status = "active"
since = "2026"
summary = "Lean 4 formalization of the Neutral Substrate theory, including propositional languages, commitment theories, consequence and consistency, interpretive frameworks, referential regimes, attribution, framework-relative propositions, contestability, referential common ground, interpretive non-commitment, extension stability, neutrality by design, and the neutrality constraint."

# === Layer Position ===

[layer]
space = "formal-theory"
role = "theory"

# === Dependency Declarations ===

[depends]
# Foundational theory repository. Downstream Structural Explainability theories
# may depend on this repository; this repository does not depend on them.
optional = []
required = []

# === Provided Artifacts ===

[provides]
# Theory repositories expose Lean modules and theorem sets.
artifacts = [
  "lean-library",
  "theorem-set",
]

[provides.formalization.public_surface]
kind = "lean-surface"
status = "active"
symbols = [
  "SE",
]
path = "SE.lean"
reason = "Public Lean root for the Neutral Substrate foundation and its reusable Structural Explainability definitions and theorems."

[provides.formalization.property_relation]
kind = "lean-theorem-set"
status = "active"
symbols = [
  "SE.NeutralSubstrate.Neutrality.interpretiveNonCommitment_of_extensionStability",
]
path = "SE/NeutralSubstrate/Neutrality/PropertyRelation.lean"
reason = "Machine-checked relation between extension stability and interpretive non-commitment."

[provides.formalization.neutrality_constraint]
kind = "lean-theorem-set"
status = "active"
symbols = [
  "SE.NeutralSubstrate.neutralByDesign_iff_foundationalLayerRestricted",
  "SE.NeutralSubstrate.noObjectLevelCommitment_of_foundationalLayerRestricted",
  "SE.NeutralSubstrate.noObjectLevelCommitment_of_neutralByDesign",
]
path = "SE/NeutralSubstrate/Constraint.lean"
reason = "Machine-checked characterization and consequences of the Neutral Substrate constraint."

# === Scope ===

[scope]
includes = [
  "propositional languages, negation, and contradiction",
  "commitment theories and theory extension",
  "consequence systems and consistency",
  "interpretive framework systems",
  "documented and admissible frameworks",
  "referent carriers and referential regimes",
  "substrate systems and substrate commitments",
  "referential fixing and referential commitments",
  "causal and normative proposition classification",
  "attribution propositions and permitted attribution",
  "object-level interpretive propositions",
  "framework-variant and framework-invariant propositions",
  "framework-compatible commitment sets",
  "contested causal or normative propositions",
  "design-time guarantee systems",
  "contestability",
  "referential common ground",
  "substrate consistency",
  "interpretive non-commitment",
  "extension stability",
  "neutrality and neutrality by design",
  "the Neutral Substrate constraint",
  "machine-checked Lean definitions and theorems",
  "theory-reference declarations and generated reference artifacts",
]

excludes = [
  "identity-regime classification",
  "operational identity auditing",
  "persistence theory",
  "transformation theory",
  "interpretive-kernel constructions",
  "Structural Explainability integration theory",
  "domain-specific interpretation policies",
  "domain-specific mappings or data",
  "runtime systems",
  "schema definitions owned by other repositories",
]

# === Validation ===

[validation]
# Runs the complete repository release-validation sequence.
entrypoint = "pwsh -File ./rel.ps1"

# Validates repository-owned theory-reference declarations.
reference_entrypoint = "uv run --locked se-theory-reference validate"

# Confirms that generated reference exports match their source declarations.
export_check_entrypoint = "uv run --locked se-theory-reference export --check"

# Runs strict theory-reference validation.
strict_entrypoint = "uv run --locked se-theory-reference validate --strict"

# Confirms that release metadata agrees with the pushed Git tag.
tag_entrypoint = "uvx --from se-manifest-schema se-manifest check-version --require-tag"

# === Behavior / Governance ===

[naming]
pattern = "se-theory-*"

[governance]
authority = "structural-explainability"

# === External References ===

[citation]
cff = "CITATION.cff"
preferred = "CITATION.cff"

[traceability]
identifier_map = "reference/traceability-registry.toml"
