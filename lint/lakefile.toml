# ============================================================
# lakefile.toml (lint package)
# ============================================================
# Lints. This package depends on Batteries.
#
# Run from this folder with:
# lake update
# lake build
# lake lint

name = "se-theory-neutral-substrate-lint"
version = "0.12.0" # CUSTOM: Updated to match the latest release of the main project
license = "Apache-2.0"

# ============================================================
# === BUILD SURFACE ===
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["SELint"]
lintDriver = "SELint"

# ============================================================
# === DEPENDENCIES ===
# ============================================================

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.34.0"

[[require]]
name = "se-theory-neutral-substrate"
path = ".."

# ============================================================
# === LINT DRIVER ===
# ============================================================

[[lean_exe]]
name = "SELint"
root = "SELint"
leanOptions = { Elab.inServer = true }
