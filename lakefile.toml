# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and verification executables.

# ============================================================
# PROJECT IDENTITY
# ============================================================

name = "SETheoryNeutralSubstrate"
version = "0.6.0"
license = "MIT"

keywords = [
  "structural-explainability",
  "formal-contract",
  "neutrality",
  "identity-regimes",
  "invariants",
  "formal-specification",
  "formal-verification",
  "proof-carrying",
  "theorem-proving",
  "lean4",
]

# ============================================================
# BUILD SURFACE
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["SE.NeutralSubstrate"]

# ============================================================
# PUBLIC LIBRARY
# ============================================================
# Downstream Lean projects import this library root.
# Lake discovers modules under the matching source directory.

[[lean_lib]]
name = "SE.NeutralSubstrate"

# === TEST LIBRARIES (internal, not exported)

[[lean_lib]]
name = "Tests"
srcDir = "test"
roots = ["TestAll", "TestBasic", "TestRegime"]
