source_module = "SE.NeutralSubstrate.Assumptions.ReferentialCommonGround"
status = "proved"
description = "Under referential common ground, referential commitments remain consistent when combined with any admissible framework."

[theorem.consistent_permittedAttribution_of_referentialCommonGround]
id = "consistent_permittedAttribution_of_referentialCommonGround"
name = "Permitted attribution remains consistent"
lean_symbol = "SE.NeutralSubstrate.Assumptions.consistent_permittedAttribution_of_referentialCommonGround"
source_module = "SE.NeutralSubstrate.Assumptions.ReferentialCommonGround"
status = "proved"
description = "Under referential common ground, referential commitments with a permitted attribution proposition remain consistent with every admissible framework."

# ============================================================
# ATTRIBUTION AND COMMON GROUND
# ============================================================

[theorem.entailsBottom_combine_adjoin_iff_of_entails]
id = "entailsBottom_combine_adjoin_iff_of_entails"
name = "Adjoining an entailed proposition preserves contradiction entailment"
lean_symbol = "SE.NeutralSubstrate.Attribution.entailsBottom_combine_adjoin_iff_of_entails"
source_module = "SE.NeutralSubstrate.Attribution.CommonGround"
status = "proved"
description = "When a proposition is already entailed, adjoining it before combining theories does not change whether the resulting theory entails contradiction."

[theorem.entailsBottom_permittedAttribution_iff]
id = "entailsBottom_permittedAttribution_iff"
name = "Permitted attribution preserves contradiction equivalence"
lean_symbol = "SE.NeutralSubstrate.Attribution.entailsBottom_permittedAttribution_iff"
source_module = "SE.NeutralSubstrate.Attribution.CommonGround"
status = "proved"
description = "Adjoining a permitted attribution proposition does not change contradiction entailment relative to the underlying referential commitments and framework commitments."

[theorem.consistent_permittedAttribution_of_commonGround]
id = "consistent_permittedAttribution_of_commonGround"
name = "Common ground preserves permitted-attribution consistency"
lean_symbol = "SE.NeutralSubstrate.Attribution.consistent_permittedAttribution_of_commonGround"
source_module = "SE.NeutralSubstrate.Attribution.CommonGround"
status = "proved"
description = "Referential common ground ensures that adjoining a permitted attribution proposition remains consistent with any admissible framework."

# ============================================================
# INTERPRETIVE NON-COMMITMENT
# ============================================================

[theorem.interpretiveNonCommitment_iff]
id = "interpretiveNonCommitment_iff"
name = "Interpretive non-commitment characterization"
lean_symbol = "SE.NeutralSubstrate.Neutrality.interpretiveNonCommitment_iff"
source_module = "SE.NeutralSubstrate.Neutrality.InterpretiveNonCommitment"
status = "proved"
description = "Interpretive non-commitment is equivalent to committing to neither side of every framework-variant proposition."

[theorem.not_substrateCommitment_of_interpretiveNonCommitment]
id = "not_substrateCommitment_of_interpretiveNonCommitment"
name = "Interpretive non-commitment excludes positive commitment"
lean_symbol = "SE.NeutralSubstrate.Neutrality.not_substrateCommitment_of_interpretiveNonCommitment"
source_module = "SE.NeutralSubstrate.Neutrality.InterpretiveNonCommitment"
status = "proved"
description = "An interpretively non-committed substrate does not commit to a framework-variant proposition."

[theorem.not_negSubstrateCommitment_of_interpretiveNonCommitment]
id = "not_negSubstrateCommitment_of_interpretiveNonCommitment"
name = "Interpretive non-commitment excludes negative commitment"
lean_symbol = "SE.NeutralSubstrate.Neutrality.not_negSubstrateCommitment_of_interpretiveNonCommitment"
source_module = "SE.NeutralSubstrate.Neutrality.InterpretiveNonCommitment"
status = "proved"
description = "An interpretively non-committed substrate does not commit to the negation of a framework-variant proposition."

[theorem.no_commitment_pair_of_interpretiveNonCommitment]
id = "no_commitment_pair_of_interpretiveNonCommitment"
name = "Interpretive non-commitment excludes both commitments"
lean_symbol = "SE.NeutralSubstrate.Neutrality.no_commitment_pair_of_interpretiveNonCommitment"
source_module = "SE.NeutralSubstrate.Neutrality.InterpretiveNonCommitment"
status = "proved"
description = "For every framework-variant proposition, interpretive non-commitment excludes commitment to both the proposition and its negation."

