# ============================================================
# Neutral Substrate Theorems
# se-theory-neutral-substrate
# ============================================================

schema = "se-substrate-theorem-registry-1"
kind = "theorem"
repo = "se-theory-neutral-substrate"
surface_module = "SE"
namespace = "SE"

# ============================================================
# THEORY EXTENSION
# ============================================================

[theorem.mem_combine_iff]
id = "mem_combine_iff"
name = "Membership in combined theories"
lean_symbol = "SE.Logic.Theory.mem_combine_iff"
source_module = "SE.Logic.Theory.TheoryExtension"
status = "proved"
description = "A proposition belongs to the combination of two commitment theories exactly when it belongs to either constituent theory."

[theorem.mem_adjoin_iff]
id = "mem_adjoin_iff"
name = "Membership after adjoining a proposition"
lean_symbol = "SE.Logic.Theory.mem_adjoin_iff"
source_module = "SE.Logic.Theory.TheoryExtension"
status = "proved"
description = "A proposition belongs to a theory with another proposition adjoined exactly when it was already in the theory or equals the adjoined proposition."

[theorem.subset_combine_left]
id = "subset_combine_left"
name = "Left theory included in combination"
lean_symbol = "SE.Logic.Theory.subset_combine_left"
source_module = "SE.Logic.Theory.TheoryExtension"
status = "proved"
description = "The left constituent commitment theory is a subset of the combined theory."

[theorem.subset_combine_right]
id = "subset_combine_right"
name = "Right theory included in combination"
lean_symbol = "SE.Logic.Theory.subset_combine_right"
source_module = "SE.Logic.Theory.TheoryExtension"
status = "proved"
description = "The right constituent commitment theory is a subset of the combined theory."

[theorem.subset_adjoin]
id = "subset_adjoin"
name = "Theory included after adjoining"
lean_symbol = "SE.Logic.Theory.subset_adjoin"
source_module = "SE.Logic.Theory.TheoryExtension"
status = "proved"
description = "A commitment theory is a subset of the theory obtained by adjoining one proposition."

# ============================================================
# CONSEQUENCE AND CONSISTENCY
# ============================================================

[theorem.entailsMono]
id = "entailsMono"
name = "Entailment monotonicity"
lean_symbol = "SE.Logic.ConsequenceSystem.entailsMono"
source_module = "SE.Logic.Consequence"
status = "proved"
description = "Entailment is preserved when the commitment theory is enlarged."

[theorem.not_entailsBottom_of_consistent]
id = "not_entailsBottom_of_consistent"
name = "Consistency excludes contradiction"
lean_symbol = "SE.Logic.not_entailsBottom_of_consistent"
source_module = "SE.Logic.Consistency"
status = "proved"
description = "A consistent commitment theory does not entail the distinguished contradiction proposition."

[theorem.consistent_of_not_entailsBottom]
id = "consistent_of_not_entailsBottom"
name = "Non-entailment of contradiction implies consistency"
lean_symbol = "SE.Logic.consistent_of_not_entailsBottom"
source_module = "SE.Logic.Consistency"
status = "proved"
description = "A commitment theory is consistent when it does not entail the distinguished contradiction proposition."

# ============================================================
# SUBSTRATE COMMITMENTS
# ============================================================

[theorem.entails_of_substrateCommitment]
id = "entails_of_substrateCommitment"
name = "Entailment from substrate commitment"
lean_symbol = "SE.Substrate.entails_of_substrateCommitment"
source_module = "SE.Substrate.Commitment"
status = "proved"
description = "A substrate commitment yields entailment from the selected substrate's commitment theory."

[theorem.substrateCommitment_of_entails]
id = "substrateCommitment_of_entails"
name = "Substrate commitment from entailment"
lean_symbol = "SE.Substrate.substrateCommitment_of_entails"
source_module = "SE.Substrate.Commitment"
status = "proved"
description = "Entailment from the selected substrate's commitment theory yields a substrate commitment."

[theorem.substrateCommitment_of_mem_referentialCommitments]
id = "substrateCommitment_of_mem_referentialCommitments"
name = "Referential commitment is a substrate commitment"
lean_symbol = "SE.Substrate.substrateCommitment_of_mem_referentialCommitments"
source_module = "SE.Substrate.ReferentialCommitments"
status = "proved"
description = "Every member of the referential commitment theory is a substrate commitment."

[theorem.fixedByReferentialRegime_of_mem_referentialCommitments]
id = "fixedByReferentialRegime_of_mem_referentialCommitments"
name = "Referential commitment is fixed by the regime"
lean_symbol = "SE.Substrate.fixedByReferentialRegime_of_mem_referentialCommitments"
source_module = "SE.Substrate.ReferentialCommitments"
status = "proved"
description = "Every member of the referential commitment theory is fixed by the substrate's referential regime."

# ============================================================
# ATTRIBUTION
# ============================================================

