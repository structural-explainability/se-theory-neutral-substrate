source_module = "SE.NeutralSubstrate.Attribution.Basic"
status = "proved"
description = "Applying the attribution assertion operation to a source and proposition produces an attribution proposition."

[theorem.attributionProposition_of_permittedAttributionProposition]
id = "attributionProposition_of_permittedAttributionProposition"
name = "Permitted attribution is an attribution proposition"
lean_symbol = "SE.NeutralSubstrate.Attribution.attributionProposition_of_permittedAttributionProposition"
source_module = "SE.NeutralSubstrate.Attribution.Permitted"
status = "proved"
description = "Every permitted attribution proposition is an attribution proposition."

[theorem.referentialCommitments_entails_of_permittedAttributionProposition]
id = "referentialCommitments_entails_of_permittedAttributionProposition"
name = "Referential commitments entail permitted attribution"
lean_symbol = "SE.NeutralSubstrate.Attribution.referentialCommitments_entails_of_permittedAttributionProposition"
source_module = "SE.NeutralSubstrate.Attribution.Permitted"
status = "proved"
description = "The substrate's referential commitment theory entails every permitted attribution proposition."

[theorem.substrateCommitment_of_permittedAttributionProposition]
id = "substrateCommitment_of_permittedAttributionProposition"
name = "Permitted attribution is a substrate commitment"
lean_symbol = "SE.NeutralSubstrate.Attribution.substrateCommitment_of_permittedAttributionProposition"
source_module = "SE.NeutralSubstrate.Attribution.Permitted"
status = "proved"
description = "Every permitted attribution proposition is a commitment of the selected substrate."

# ============================================================
# FRAMEWORK-RELATIVE PROPERTIES
# ============================================================

[theorem.entails_substrateFrameworkCommitments_of_substrateCommitment]
id = "entails_substrateFrameworkCommitments_of_substrateCommitment"
name = "Substrate commitment persists under framework combination"
lean_symbol = "SE.NeutralSubstrate.FrameworkRelative.entails_substrateFrameworkCommitments_of_substrateCommitment"
source_module = "SE.NeutralSubstrate.FrameworkRelative.Variant"
status = "proved"
description = "Every substrate commitment is entailed by the theory combining the substrate with any selected framework."

[theorem.exists_entails_of_frameworkVariantProposition]
id = "exists_entails_of_frameworkVariantProposition"
name = "Framework-variant proposition has an affirming framework"
lean_symbol = "SE.NeutralSubstrate.FrameworkRelative.exists_entails_of_frameworkVariantProposition"
source_module = "SE.NeutralSubstrate.FrameworkRelative.Variant"
status = "proved"
description = "A framework-variant proposition has an admissible framework under which the combined theory entails the proposition."

[theorem.exists_entailsNeg_of_frameworkVariantProposition]
id = "exists_entailsNeg_of_frameworkVariantProposition"
name = "Framework-variant proposition has a negating framework"
lean_symbol = "SE.NeutralSubstrate.FrameworkRelative.exists_entailsNeg_of_frameworkVariantProposition"
source_module = "SE.NeutralSubstrate.FrameworkRelative.Variant"
status = "proved"
description = "A framework-variant proposition has an admissible framework under which the combined theory entails its negation."

[theorem.consistent_combine_of_frameworkCompatibleCommitmentSet]
id = "consistent_combine_of_frameworkCompatibleCommitmentSet"
name = "Framework-compatible commitment set remains consistent"
lean_symbol = "SE.NeutralSubstrate.FrameworkRelative.consistent_combine_of_frameworkCompatibleCommitmentSet"
source_module = "SE.NeutralSubstrate.FrameworkRelative.CompatibleCommitmentSet"
status = "proved"
description = "A framework-compatible commitment set remains consistent when combined with the commitments of any admissible framework."

# ============================================================
# DESIGN-TIME GUARANTEES
# ============================================================

[theorem.guaranteedAtDesignTime_iff]
id = "guaranteedAtDesignTime_iff"
name = "Design-time guarantee characterization"
lean_symbol = "SE.NeutralSubstrate.guaranteedAtDesignTime_iff"
source_module = "SE.NeutralSubstrate.DesignTimeGuarantee"
status = "proved"
description = "A proposition is guaranteed at design time exactly when some permitted basis establishes it."

[theorem.holds_of_guaranteedAtDesignTime]
id = "holds_of_guaranteedAtDesignTime"
name = "Design-time guarantees are sound"
lean_symbol = "SE.NeutralSubstrate.holds_of_guaranteedAtDesignTime"
source_module = "SE.NeutralSubstrate.DesignTimeGuarantee"
status = "proved"
description = "Every proposition guaranteed at design time holds."

[theorem.guaranteedAtDesignTime_of_establishes]
id = "guaranteedAtDesignTime_of_establishes"
name = "Permitted establishment yields design-time guarantee"
lean_symbol = "SE.NeutralSubstrate.guaranteedAtDesignTime_of_establishes"
source_module = "SE.NeutralSubstrate.DesignTimeGuarantee"
status = "proved"
description = "A permitted basis that establishes a proposition produces a design-time guarantee for that proposition."

[theorem.exists_permittedBasis_of_guaranteedAtDesignTime]
id = "exists_permittedBasis_of_guaranteedAtDesignTime"
name = "Design-time guarantee has a permitted basis"
lean_symbol = "SE.NeutralSubstrate.exists_permittedBasis_of_guaranteedAtDesignTime"
source_module = "SE.NeutralSubstrate.DesignTimeGuarantee"
status = "proved"
description = "Every design-time guarantee has a permitted basis that establishes the guaranteed proposition."

# ============================================================
# CONTESTABILITY
# ============================================================

[theorem.contestability_iff]
id = "contestability_iff"
name = "Contestability characterization"
lean_symbol = "SE.NeutralSubstrate.Assumptions.contestability_iff"
source_module = "SE.NeutralSubstrate.Assumptions.Contestability"
status = "proved"
description = "Contestability is equivalent to the exclusion of design-time guarantees of framework invariance for every contested causal or normative proposition."

[theorem.not_guaranteedFrameworkInvariant_of_contestability]
id = "not_guaranteedFrameworkInvariant_of_contestability"
name = "Contestability excludes guaranteed framework invariance"
lean_symbol = "SE.NeutralSubstrate.Assumptions.not_guaranteedFrameworkInvariant_of_contestability"
source_module = "SE.NeutralSubstrate.Assumptions.Contestability"
status = "proved"
description = "Under contestability, a contested causal or normative proposition is not guaranteed at design time to be framework invariant."

