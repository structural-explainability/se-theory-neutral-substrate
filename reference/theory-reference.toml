# ============================================================
# reference/theory-reference.toml
# ============================================================
# Theory reference configuration for se-theory-reference-kit.
#
# WHY: The theory repository owns Lean source, reference TOML,
# and exported JSON artifacts.
# The reusable kit owns validation, export, catalog, scaffold,
# and inspection machinery.

schema = "se-theory-reference"
schema_version = "0.1.0"

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-neutral-substrate"
theory = "neutral-substrate"
description = "Neutral substrate theory repository for Structural Explainability."

# === Lean Public Surface ===

[lean]
root_module = "SE"

public_modules = [
    "SE",
    "SE.Logic.Language.Basic",
    "SE.Logic.Theory.CommitmentTheory",
    "SE.Logic.Theory.TheoryExtension",
    "SE.Logic.Consequence",
    "SE.Logic.Consistency",
    "SE.Framework.Basic",
    "SE.Framework.Admissible",
    "SE.Framework.Class",
    "SE.Referent.Carriers",
    "SE.Substrate.ReferentialRegime",
    "SE.Substrate.Basic",
    "SE.Substrate.Commitment",
    "SE.Substrate.ReferentialCommitments",
    "SE.NeutralSubstrate.Classification.CausalNormative",
    "SE.NeutralSubstrate.Classification.ContestedCausalOrNormative",
    "SE.NeutralSubstrate.Attribution.Basic",
    "SE.NeutralSubstrate.Attribution.Permitted",
    "SE.NeutralSubstrate.Attribution.CommonGround",
    "SE.NeutralSubstrate.Interpretation.ObjectLevelProposition",
    "SE.NeutralSubstrate.Interpretation.ObjectLevelCausalOrNormativeCommitment",
    "SE.NeutralSubstrate.FrameworkRelative.Variant",
    "SE.NeutralSubstrate.FrameworkRelative.Invariant",
    "SE.NeutralSubstrate.FrameworkRelative.CompatibleCommitmentSet",
    "SE.NeutralSubstrate.DesignTimeGuarantee",
    "SE.NeutralSubstrate.Assumptions.Contestability",
    "SE.NeutralSubstrate.Assumptions.ReferentialCommonGround",
    "SE.NeutralSubstrate.Assumptions.SubstrateConsistency",
    "SE.NeutralSubstrate.Neutrality.InterpretiveNonCommitment",
    "SE.NeutralSubstrate.Neutrality.ExtensionStability",
    "SE.NeutralSubstrate.Neutrality.PropertyRelation",
    "SE.NeutralSubstrate.Neutrality.ByDesign",
    "SE.NeutralSubstrate.Constraint",
    "SE.NeutralSubstrate.Spec",
]

test_modules = ["SETest"]

# === Reference Artifacts ===

[reference]
root = "reference"

# === Exported Machine Artifacts ===

[export]
root = "data/neutral-substrate"

# === Surface-Kind Mapping ===

[surface_kinds]
axiom = "reference/substrate-axioms.toml"
dependency = "reference/dependency-registry.toml"
predicate = "reference/substrate-predicates.toml"
requirement = "reference/substrate-requirements.toml"
theorem = "reference/substrate-theorems.toml"
traceability = "reference/traceability-registry.toml"
type = "reference/substrate-types.toml"

# === Export Mapping ===

[export_map]
axiom = "data/neutral-substrate/substrate-axiom-registry.json"
catalog = "data/neutral-substrate/neutral-substrate-catalog.json"
predicate = "data/neutral-substrate/substrate-predicate-registry.json"
requirement = "data/neutral-substrate/substrate-requirement-registry.json"
theorem = "data/neutral-substrate/substrate-theorem-registry.json"
traceability = "data/neutral-substrate/traceability-registry.json"
type = "data/neutral-substrate/substrate-type-registry.json"
